<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng Dẫn Getkey Script</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0c10;
            background-image: radial-gradient(circle at 50% 15%, rgba(255, 120, 0, 0.12) 0%, transparent 60%),
                              linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            text-transform: capitalize;
        }
        .brand-header p {
            font-size: 13px;
            color: #ff9d3b;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .card {
            width: 100%;
            background: #12141a;
            border: 1px solid #1f232d;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-box {
            position: relative;
            width: 100%;
            padding-top: 177.78%;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255, 157, 59, 0.3);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.15);
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 14px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #4b505e;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <h1>hướng dẫn getkey script</h1>
            <p>Guide to getting the script key</p>
        </div>
        
        <div class="card">
            <div class="video-box">
                <iframe 
                    src="https://drive.google.com/file/d/1dXnKmyNfdfhXkLfDM7NDXVt107dwuKf0/preview?autoplay=1&rm=minimal" 
                    allow="autoplay; encrypted-media; fullscreen" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="footer">Wero Hub Auth • System 2026</div>
    </div>
</body>
</html>
